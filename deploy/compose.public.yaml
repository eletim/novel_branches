# Standalone file. Do not combine with the local-development compose.yaml.
services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PUBLISH_PORT:-${HTTPS_PORT:-443}}:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      NGINX_ENVSUBST_FILTER: ^(PUBLIC_HOST|APP_ORIGIN|APP_BASE_PATH|HTTPS_PORT)$
    volumes:
      - ${NGINX_TEMPLATE:-./nginx/default.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_DIR:?Set TLS_DIR}:/etc/nginx/tls:ro
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [edge, app-net, auth-net]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_MODE: oidc
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      COOKIE_SECURE: 'true'
      OIDC_ISSUER: ${APP_ORIGIN}/id/realms/novel-branches
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/id/realms/novel-branches
      OIDC_CLIENT_ID: novel-web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
      OIDC_MEMBER_ROLE: novel-member
      OIDC_MCP_AUDIENCE: ${OIDC_MCP_AUDIENCE:-novel-mcp}
    volumes:
      - novel-data:/app/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [app-net, auth-net]
    depends_on:
      keycloak:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  keycloak:
    mem_limit: ${KC_MEMORY_LIMIT:-768m}
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start, --import-realm]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Set KC_ADMIN_PASSWORD}
      KC_HOSTNAME: ${APP_ORIGIN}/id
      KC_HOSTNAME_STRICT: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /id
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_FEATURES: resource-indicators
      JAVA_OPTS_KC_HEAP: ${KC_HEAP:--Xms64m -Xmx256m}
      # Realm-import placeholders; not rendered into tracked files.
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      APP_ORIGIN: ${APP_ORIGIN}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    volumes:
      - ${KEYCLOAK_REALM_FILE:-./keycloak/novel-branches-realm.json}:/opt/keycloak/data/import/novel-branches-realm.json:ro
    networks: [auth-net, db-net]
    security_opt: [no-new-privileges:true]
    depends_on:
      keycloak-db:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  keycloak-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    networks: [db-net]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U keycloak -d keycloak]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

networks:
  edge:
    name: ${EDGE_NETWORK_NAME:-${COMPOSE_PROJECT_NAME}_edge}
    external: ${EDGE_NETWORK_EXTERNAL:-false}
  app-net: {internal: true}
  auth-net: {internal: true}
  db-net: {internal: true}
volumes:
  novel-data: {}
  keycloak-data: {}
